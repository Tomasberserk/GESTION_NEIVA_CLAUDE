version: "3.9"

# PostgreSQL removido — ahora usa Supabase (db.ldzevrggvzbsayofermn.supabase.co)

services:
  redis:
    image: redis:7-alpine
    container_name: gestion_neiva_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
