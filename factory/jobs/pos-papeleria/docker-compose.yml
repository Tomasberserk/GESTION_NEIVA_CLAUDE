version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: pos_papeleria_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pos_papeleria}
      POSTGRES_USER: ${POSTGRES_USER:-papeleria_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-papeleria_user} -d ${POSTGRES_DB:-pos_papeleria}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pos_papeleria_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-papeleria_user}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-pos_papeleria}
      SECRET_KEY: ${SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      UPLOAD_DIR: /app/media
      DEBUG: ${DEBUG:-false}
    ports:
      - "8000:8000"
    volumes:
      - media_files:/app/media
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pos_papeleria_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "5173:80"

volumes:
  postgres_data:
  media_files:
