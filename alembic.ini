[alembic]
# Ruta al directorio de migraciones
script_location = alembic

# La URL de la base de datos NO se define aquí.
# Se inyecta desde la variable de entorno DATABASE_URL en alembic/env.py
sqlalchemy.url =

# Formato del nombre de archivo para nuevas migraciones
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Zona horaria para las fechas en los archivos de migración
timezone = UTC

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
