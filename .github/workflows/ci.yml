name: CI Pipeline — Monolith Governance & QA

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  backend-and-governance:
    name: Lint, Boundary Check & Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Stage 1 — Syntax & Compile Check
        run: |
          python -m compileall -q app tests

      - name: Stage 2 — Module Boundary Enforcement (import-linter)
        run: |
          lint-imports

      - name: Stage 3 — Backend Test Suite (Unit, Integration, E2E)
        env:
          DATABASE_URL: "sqlite:///:memory:"
          SECRET_KEY: "ci-test-secret-key-not-for-production-use-only"
          SUPERADMIN_KEY: "ci-superadmin-test-key"
        run: |
          pytest tests/ -q

      - name: Stage 4 — End-to-End Business Journey Simulation
        env:
          DATABASE_URL: "sqlite:///:memory:"
          SECRET_KEY: "ci-test-secret-key-not-for-production-use-only"
          SUPERADMIN_KEY: "ci-superadmin-test-key"
        run: |
          python run_e2e_simulation.py

  frontend-verify:
    name: Frontend Voice FSM Tests & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm install

      - name: Run Voice Turn Manager FSM Tests
        run: npm run test:voice

      - name: Build production SPA bundle
        run: npm run build
