services:
  - type: web
    name: gestion-neiva-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: pilot

      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 480
      - key: CORS_ORIGINS
        value: https://gestion-neiva-claude.vercel.app,http://localhost:5173
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_API_KEY
        sync: false